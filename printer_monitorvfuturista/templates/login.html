{% extends "base.html" %}
{% block head %}
<style>
    .login-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .login-box {
        background: var(--panel-bg);
        border: 1px solid var(--border-tech);
        padding: 40px;
        border-radius: 8px;
        width: 100%;
        max-width: 450px;
        backdrop-filter: blur(15px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0, 243, 255, 0.05);
        position: relative;
    }
    
    /* Cantos Estilizados */
    .login-box::after, .login-box::before {
        content: '';
        position: absolute;
        width: 20px; height: 20px;
        border: 2px solid var(--neon-cyan);
        transition: 0.3s;
    }
    .login-box::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .login-box::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    .login-title {
        font-family: 'Share Tech Mono', monospace;
        color: var(--neon-cyan);
        text-align: center;
        margin-bottom: 30px;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }

    .form-label {
        font-family: 'Share Tech Mono', monospace;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <h2 class="login-title">AUTENTICAÇÃO<br>DO SISTEMA</h2>
        
        {% if error %}
        <div class="mb-4" style="color: var(--neon-red); font-family: 'Share Tech Mono'; text-align: center; border: 1px solid var(--neon-red); padding: 10px; background: rgba(255,0,0,0.1);">
            > ACESSO NEGADO: {{ error }}
        </div>
        {% endif %}
        
        <form method="post">
            <div class="mb-4">
                <label for="username" class="form-label">> IDENTIFICAÇÃO</label>
                <input type="text" class="form-control form-control-lg" name="username" required autocomplete="off" autofocus>
            </div>
            <div class="mb-5">
                <label for="password" class="form-label">> CÓDIGO DE ACESSO</label>
                <input type="password" class="form-control form-control-lg" name="password" required>
            </div>
            <button type="submit" class="btn btn-tech w-100 btn-lg" style="font-size: 1.2rem;">INICIAR SESSÃO</button>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}{% endblock %}
