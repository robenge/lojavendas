{% extends "base.html" %}
{% block head %}
<style>
    /* Cards das Impressoras */
    .card-futuristic {
        background: var(--panel-bg);
        border: 1px solid var(--border-tech);
        border-radius: 8px;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    
    .card-futuristic::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 4px; height: 100%;
        background: var(--neon-cyan);
        box-shadow: 0 0 10px var(--neon-cyan);
        transition: all 0.3s;
    }

    .card-futuristic:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0, 243, 255, 0.15);
        border-color: var(--neon-cyan);
    }

    .card-futuristic.alarm-active {
        border-color: var(--neon-red) !important;
        background: rgba(30, 5, 10, 0.85);
    }
    .card-futuristic.alarm-active::before {
        background: var(--neon-red);
        box-shadow: 0 0 15px var(--neon-red);
        animation: pulse-border 1s infinite alternate;
    }
    
    @keyframes pulse-border {
        0% { opacity: 0.5; box-shadow: 0 0 5px var(--neon-red); }
        100% { opacity: 1; box-shadow: 0 0 20px var(--neon-red), 0 0 30px var(--neon-red); }
    }

    /* Textos e Badges */
    .ip-title {
        font-family: 'Share Tech Mono', monospace;
        font-size: 1.25rem;
        color: #fff;
        letter-spacing: 1px;
    }
    
    .status-online { color: var(--neon-green); text-shadow: 0 0 8px var(--neon-green); }
    .status-offline { color: var(--neon-red); text-shadow: 0 0 8px var(--neon-red); }
    
    .badge-error {
        background: transparent;
        border: 1px solid var(--neon-red);
        color: var(--neon-red);
        box-shadow: inset 0 0 5px rgba(255,51,102,0.3);
        animation: blink-badge 1s infinite;
    }
    .badge-warning {
        background: transparent;
        border: 1px solid var(--neon-orange);
        color: var(--neon-orange);
        box-shadow: inset 0 0 5px rgba(255,170,0,0.3);
    }
    .badge-info-tech {
        background: transparent;
        border: 1px solid var(--neon-cyan);
        color: var(--neon-cyan);
        box-shadow: inset 0 0 5px rgba(0,243,255,0.3);
    }
    
    @keyframes blink-badge { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Barras de Toner Futuristas */
    .toner-container { margin-top: 10px; }
    .toner-bar-bg {
        background-color: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 2px;
        height: 12px;
        overflow: hidden;
        position: relative;
    }
    .toner-bar-fill {
        height: 100%;
        transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
    }
    .toner-bar-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        animation: scanline 2s linear infinite;
    }

    @keyframes scanline {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

    /* Gráficos e Componentes de Layout */
    .chart-container {
        background: var(--panel-bg);
        border: 1px solid var(--border-tech);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    
    .section-header {
        font-family: 'Share Tech Mono', monospace;
        color: var(--neon-cyan);
        text-shadow: 0 0 10px rgba(0,243,255,0.3);
        border-bottom: 1px solid rgba(0,243,255,0.2);
        padding-bottom: 10px;
        margin-bottom: 20px;
    }

    /* Caixas de Métricas Superiores */
    .metric-box {
        background: var(--panel-bg);
        border: 1px solid var(--border-tech);
        border-radius: 8px;
        padding: 15px;
        text-align: center;
        backdrop-filter: blur(10px);
        transition: 0.3s;
    }
    .metric-title { font-family: 'Share Tech Mono', monospace; font-size: 0.85rem; color: var(--text-main); letter-spacing: 1px; }
    .metric-value { font-family: 'Rajdhani', sans-serif; font-size: 2.8rem; font-weight: 700; line-height: 1; margin-top: 8px; }
    
    .box-blue { border-bottom: 4px solid var(--neon-cyan); }
    .box-blue .metric-value { color: var(--neon-cyan); text-shadow: 0 0 15px rgba(0,243,255,0.5); }
    
    .box-green { border-bottom: 4px solid var(--neon-green); }
    .box-green .metric-value { color: var(--neon-green); text-shadow: 0 0 15px rgba(0,255,102,0.5); }
    
    .box-red { border-bottom: 4px solid var(--neon-red); }
    .box-red .metric-value { color: var(--neon-red); text-shadow: 0 0 15px rgba(255,51,102,0.5); }
    
    .box-warning { border-bottom: 4px solid var(--neon-orange); }
    .box-warning .metric-value { color: var(--neon-orange); text-shadow: 0 0 15px rgba(255,170,0,0.5); }

    /* Estilo para sensor inativo */
    .sensor-offline-badge {
        display: inline-block;
        color: var(--neon-orange);
        background: rgba(255, 170, 0, 0.1);
        border: 1px solid rgba(255, 170, 0, 0.4);
        padding: 5px 10px;
        border-radius: 4px;
        font-family: 'Share Tech Mono', monospace;
        font-weight: bold;
        font-size: 0.85rem;
        box-shadow: inset 0 0 8px rgba(255,170,0,0.2);
    }

    /* Otimização Perfeita para PDF e Impressão */
    @media print {
        @page { margin: 1cm; }
        body { background: #fff !important; color: #000 !important; }
        .navbar-tech, .input-group, button, .chart-container, .no-print { display: none !important; }
        .card-futuristic { 
            background: #fff !important; 
            border: 1px solid #ddd !important; 
            color: #000 !important; 
            box-shadow: none !important;
            page-break-inside: avoid;
        }
        .card-futuristic::before { display: none !important; }
        .text-white, .text-light, .text-muted, .ip-title, .status-online, .status-offline { 
            color: #000 !important; 
            text-shadow: none !important; 
        }
        .badge { border: 1px solid #000 !important; color: #000 !important; }
        .metric-box { border: 1px solid #000 !important; color: #000 !important; }
        .metric-value { color: #000 !important; text-shadow: none !important; }
        .toner-bar-bg { border: 1px solid #000 !important; }
        .toner-bar-fill { filter: grayscale(100%); }
    }
</style>
{% endblock %}

{% block content %}
<div class="row mb-3 align-items-center">
    <div class="col-md-6">
        <h3 class="section-header mb-0">
            <span class="text-white">STATUS DO SISTEMA //</span> MONITORAÇÃO ATIVA
        </h3>

    <!-- Botões de Exportação e Busca -->

.781v1.237Z"/></svg>
            BAIXAR RELATÓRIO (CSV)
        </button>
        <button class="btn btn-sm btn-tech me-3" onclick="window.print()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-earmark-pdf me-1" viewBox="0 0 16 16"><path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2zM9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5v2z"/><path d="M4.603 14.087a.81.81 0 0 1-.438-.42c-.195-.388-.13-.776.08-1.102.198-.307.526-.568.897-.787a7.68 7.68 0 0 1 1.482-.645 19.697 19.697 0 0 0 1.062-2.227 7.269 7.269 0 0 1-.43-1.295c-.086-.4-.119-.796-.046-1.136.075-.354.274-.672.65-.823.192-.077.4-.12.602-.077a.7.7 0 0 1 .477.365c.088.164.12.356.127.538.007.188-.012.396-.047.614-.084.51-.27 1.134-.52 1.794a10.954 10.954 0 0 0 .98 1.686 5.753 5.753 0 0 1 1.334.05c.364.066.734.195.96.465.12.144.193.32.2.518.007.192-.047.382-.138.563a1.04 1.04 0 0 1-.354.416.856.856 0 0 1-.51.138c-.331-.014-.654-.196-.933-.417a5.712 5.712 0 0 1-.911-.95 11.651 11.651 0 0 0-1.997.406 11.307 11.307 0 0 1-1.02 1.51c-.292.35-.609.656-.927.787a.793.793 0 0 1-.58.029zm1.379-1.901c-.166.076-.32.156-.459.238-.328.194-.541.383-.647.547-.094.145-.096.25-.04.361.01.022.02.036.026.044a.266.266 0 0 0 .035-.012c.137-.056.355-.235.635-.572a8.18 8.18 0 0 0 .45-.606zm1.64-1.33a12.71 12.71 0 0 1 1.01-.193 11.744 11.744 0 0 1-.51-.858 20.801 20.801 0 0 1-.5 1.05zm2.446.45c.15.163.296.3.435.41.24.19.407.253.498.256a.107.107 0 0 0 .07-.015.307.307 0 0 0 .094-.125.436.436 0 0 0 .059-.2.095.095 0 0 0-.026-.063c-.052-.062-.2-.152-.518-.209a3.876 3.876 0 0 0-.612-.053zM8.078 7.8a6.7 6.7 0 0 0 .2-.828c.031-.188.043-.343.038-.465a.613.613 0 0 0-.032-.198.517.517 0 0 0-.145.04c-.087.035-.158.106-.196.283-.04.192-.03.469.046.822.024.111.054.227.09.346z"/></svg>
            IMPRIMIR (PDF)
        </button>
        <div class="input-group" style="width: 250px;">
            <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-tech); color: var(--neon-cyan);">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/></svg>
            </span>
            <input type="search" id="search-input" class="form-control border-start-0 ps-0" placeholder="Filtrar dados...">
        </div>
    </div>
</div>

<!-- Métricas Superiores -->
<div class="row g-3 mb-4">
    <div class="col-md-3 col-6">
        <div class="metric-box box-blue">
            <div class="metric-title">MONITORADO TOTAL</div>
            <div class="metric-value" id="metric-total">0</div>
        </div>
    </div>
    <div class="col-md-3 col-6">
        <div class="metric-box box-green">
            <div class="metric-title">ON-LINE</div>
            <div class="metric-value" id="metric-online">0</div>
        </div>
    </div>
    <div class="col-md-3 col-6">
        <div class="metric-box box-red">
            <div class="metric-title">OFF-LINE</div>
            <div class="metric-value" id="metric-offline">0</div>
        </div>
    </div>
    <div class="col-md-3 col-6">
        <div class="metric-box box-warning">
            <div class="metric-title">ALERTAS CRÍTICOS</div>
            <div class="metric-value" id="metric-alerts">0</div>
        </div>
    </div>
</div>

<!-- Gráficos (Plotly) -->
<div class="row mb-4">
    <div class="col-md-4">
        <div class="chart-container">
            <h5 class="text-center" style="font-family: 'Share Tech Mono'; color: var(--text-muted);">DISTRIBUIÇÃO DE STATUS</h5>
            <div id="status-pie-chart" style="height: 320px;"></div>
        </div>
    </div>
    <div class="col-md-8">
        <div class="chart-container">
            <h5 class="text-center" style="font-family: 'Share Tech Mono'; color: var(--text-muted);">EVOLUÇÃO DOS ALERTAS (HISTÓRICO REAL 7 DIAS)</h5>
            <div id="evolution-chart" style="height: 320px;"></div>
        </div>
    </div>
</div>

<!-- Cards das impressoras -->
<h4 class="section-header mt-4 mb-3" style="font-size: 1.3rem;">DISPOSITIVOS DA REDE //</h4>
<div id="cards-container"></div>

<script>
let autoRefreshInterval = 30000;
let printersData = [];
let historyData = [];

// Mapeamento dos códigos exatos do backend para Labels em PT-BR bonitas
const ERROR_LABELS = {
    'toner_black_low': 'TONER < 20%',
    'toner_black_critical': 'TONER < 10%',
    'paper_jam': 'PAPEL ATOLADO',
    'no_paper': 'SEM PAPEL',
    'cover_open': 'TAMPA ABERTA',
    'ricoh_sc_error': 'ERRO SC (RICOH)',
    'reboot': 'REINICIALIZADA'
};

function fetchAllData() {
    fetch('/api/printers')
        .then(res => res.json())
        .then(data => {
            printersData = data;
            updateMetrics(data);
            renderCards(data);
            
            // Busca histórico real
            fetch('/api/history')
                .then(res => res.json())
                .then(hData => {
                    historyData = hData;
                    renderCharts(data, hData);
                });
        });
}

function updateMetrics(printers) {
    let total = printers.length;
    let online = printers.filter(p => p.status.includes('online')).length;
    let offline = printers.filter(p => !p.status.includes('online')).length;
    
    // Alertas são considerados erros que não sejam apenas "offline"
    let alerts = printers.filter(p => p.errors && p.errors.some(e => e !== 'offline')).length;

    document.getElementById('metric-total').innerText = total;
    document.getElementById('metric-online').innerText = online;
    document.getElementById('metric-offline').innerText = offline;
    document.getElementById('metric-alerts').innerText = alerts;
}

function getTonerColor(level) {
    if (level < 10) return ['var(--neon-red)', '0 0 10px var(--neon-red)'];
    if (level < 20) return ['var(--neon-orange)', '0 0 10px var(--neon-orange)'];
    return ['var(--neon-cyan)', '0 0 10px rgba(0,243,255,0.5)'];
}

function renderCards(printers) {
    const container = document.getElementById('cards-container');
    const search = document.getElementById('search-input').value.toLowerCase();
    let html = '<div class="row g-4">';
    const filtered = printers.filter(p => 
        (p.ip||'').includes(search) || 
        (p.location||'').toLowerCase().includes(search) || 
        (p.site||'').toLowerCase().includes(search)
    );

    filtered.forEach(p => {
        let isOnline = p.status.includes('online');
        let statusClass = isOnline ? 'status-online' : 'status-offline';
        let statusText = isOnline ? 'ONLINE' : 'OFFLINE';
        
        let criticalErrors = (p.errors || []).filter(e => e !== 'offline');
        let alarmClass = criticalErrors.length > 0 ? 'alarm-active' : '';
        
        let errorBadges = '';
        (p.errors || []).forEach(err => {
            if (err === 'offline') return;
            
            let label = ERROR_LABELS[err] || err.toUpperCase().replace(/_/g, ' ');
            let badgeClass = err.includes('low') || err === 'reboot' ? 'badge-warning' : 'badge-error';
            if(err === 'reboot') badgeClass = 'badge-info-tech'; // Destaca reboot diferente
            
            errorBadges += `<span class="badge ${badgeClass} me-1 mb-1">${label}</span>`;
        });

        let tonerHtml = '';
        if (p.toner_black !== null && p.toner_black !== undefined) {
            let [bgColor, glow] = getTonerColor(p.toner_black);
            tonerHtml = `
                <div class="toner-container">
                    <div class="d-flex justify-content-between mb-1">
                        <small style="color: var(--text-muted); font-family: 'Share Tech Mono';">TONER (K)</small>
                        <small style="color: ${bgColor}; font-family: 'Share Tech Mono';">${p.toner_black}%</small>
                    </div>
                    <div class="toner-bar-bg">
                        <div class="toner-bar-fill" style="width:${p.toner_black}%; background-color:${bgColor}; box-shadow: ${glow};"></div>
                    </div>
                </div>`;
        } else {
            tonerHtml = '<div class="mt-3 text-center"><span class="sensor-offline-badge">[ SENSOR INDISPONÍVEL ]</span></div>';
        }

        html += `
        <div class="col-lg-3 col-md-6">
            <div class="card card-futuristic h-100 p-3 ${alarmClass}">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="ip-title">${p.ip}</span>
                    <span class="${statusClass} fw-bold" style="font-family: 'Share Tech Mono'; font-size: 0.9rem;">[ ${statusText} ]</span>
                </div>
                <div class="text-light opacity-75 mb-1" style="font-size: 0.95rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-geo-alt me-1" viewBox="0 0 16 16"><path d="M12.166 8.94c-.524 1.062-1.234 2.12-1.96 3.07A32 32 0 0 1 8 14.58a32 32 0 0 1-2.206-2.57c-.726-.95-1.436-2.008-1.96-3.07C3.304 7.867 3 6.862 3 6a5 5 0 0 1 10 0c0 .862-.305 1.867-.834 2.94M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10"/></svg>
                    ${p.location || 'N/A'} <span class="text-muted">|</span> ${p.site || 'N/A'}
                </div>
                
                ${errorBadges ? `<div class="mt-2">${errorBadges}</div>` : ''}
                
                ${tonerHtml}
                
                <div class="d-flex justify-content-between align-items-end mt-auto pt-3">
                    <div class="small" style="color: var(--text-muted); font-family: 'Share Tech Mono';">
                        VOL: <span class="text-light">${p.page_count || '---'}</span> pgs
                    </div>
                    <div style="font-size: 0.7rem; color: rgba(255,255,255,0.3); font-family: 'Share Tech Mono'; text-align: right;">
                        ATUALIZADO:<br>${p.last_update ? p.last_update.split(' ')[1] : '--:--:--'}
                    </div>
                </div>
            </div>
        </div>`;
    });

    if (filtered.length === 0) {
        html += '<div class="col-12 text-center mt-5"><h4 style="color: var(--text-muted); font-family: \'Share Tech Mono\';">NENHUM DISPOSITIVO ENCONTRADO NA MATRIZ</h4></div>';
    }
    html += '</div>';
    container.innerHTML = html;
}

function renderCharts(printers, history) {
    let online = printers.filter(p => p.status.includes('online')).length;
    let offline = printers.filter(p => !p.status.includes('online')).length;
    
    // Pizza Sci-Fi de Status
    let pieData = [{
        values: [online, offline],
        labels: ['ONLINE', 'OFFLINE/ERRO'],
        type: 'pie',
        hole: 0.6,
        textinfo: 'percent',
        marker: { 
            colors: ['#00ff66', '#ff3366'],
            line: { color: '#03050a', width: 2 }
        }
    }];
    let pieLayout = {
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',
        font: { color: '#e0f2fe', family: 'Share Tech Mono' },
        margin: { t: 10, b: 10, l: 10, r: 10 },
        showlegend: true,
        legend: { x: 1, y: 0.5 }
    };
    Plotly.newPlot('status-pie-chart', pieData, pieLayout, { responsive: true, displayModeBar: false });

    // Evolução Gráfica (Dinâmico e Real Baseado em History)
    let dateCounts = {};
    let now = new Date();
    
    // Preparar os últimos 7 dias com contagem zero
    for(let i=6; i>=0; i--) {
        let d = new Date(now);
        d.setDate(d.getDate() - i);
        let dateStr = d.toISOString().split('T')[0]; // YYYY-MM-DD
        dateCounts[dateStr] = { alarms: 0, offlineEvents: 0 };
    }

    // Processar o histórico real da API
    history.forEach(ev => {
        let evDate = ev.timestamp.split(' ')[0]; // Pega YYYY-MM-DD
        if (dateCounts[evDate]) {
            if (ev.type === 'offline') {
                dateCounts[evDate].offlineEvents += 1;
            } else if (ev.type !== 'online' && ev.type !== 'reboot') {
                // Conta erros e alarmes de toner/papel
                dateCounts[evDate].alarms += 1;
            }
        }
    });

    let xLabels = Object.keys(dateCounts).map(d => d.split('-').slice(1).join('/')); // Formato MM/DD
    let yAlarms = Object.keys(dateCounts).map(d => dateCounts[d].alarms);
    let yOffline = Object.keys(dateCounts).map(d => dateCounts[d].offlineEvents);

    let traceAlarms = {
        x: xLabels,
        y: yAlarms,
        type: 'bar',
        name: 'Novos Alertas (Toner/Papel)',
        marker: { 
            color: 'rgba(255, 170, 0, 0.6)',
            line: { color: '#ffaa00', width: 1 } 
        }
    };
    
    let traceOffline = {
        x: xLabels,
        y: yOffline,
        type: 'scatter',
        mode: 'lines+markers',
        name: 'Quedas (Offline)',
        line: {color: '#ff3366', width: 3, shape: 'spline'},
        marker: { size: 6, color: '#ff3366' }
    };

    let evoLayout = {
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',
        font: { color: '#7dd3fc', family: 'Share Tech Mono' },
        margin: { t: 10, b: 30, l: 40, r: 10 },
        showlegend: true,
        legend: { orientation: 'h', y: 1.15, x: 0 },
        yaxis: { 
            title: 'Qtd Ocorrências', 
            gridcolor: 'rgba(0, 243, 255, 0.1)',
            min: 0
        },
        xaxis: { gridcolor: 'transparent' }
    };
    
    Plotly.newPlot('evolution-chart', [traceAlarms, traceOffline], evoLayout, { responsive: true, displayModeBar: false });
}

// === EXPORTAÇÃO PARA CSV ===
function exportCSV() {
    let csvContent = "data:text/csv;charset=utf-8,";
    // Cabeçalho
    csvContent += "IP,Local,Site,Status,Toner (%),Contador (Páginas),Alertas Ativos,Ultima Atualizacao\n";
    
    printersData.forEach(p => {
        let isOnline = p.status.includes('online');
        let status = isOnline ? 'ONLINE' : 'OFFLINE';
        let toner = p.toner_black !== null ? p.toner_black : 'N/D';
        let count = p.page_count !== null ? p.page_count : 'N/D';
        
        let errorList = (p.errors || []).filter(e => e !== 'offline').map(e => ERROR_LABELS[e] || e).join(" | ");
        if(!errorList) errorList = 'Nenhum';
        
        // Monta a linha validando as strings pra evitar quebrar o CSV se houver vírgulas nos nomes
        let row = `"${p.ip}","${p.location || ''}","${p.site || ''}","${status}","${toner}","${count}","${errorList}","${p.last_update || ''}"`;
        csvContent += row + "\n";
    });
    
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    
    let dateStr = new Date().toISOString().split('T')[0];
    link.setAttribute("download", `relatorio_printmonitor_porto_${dateStr}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

document.addEventListener('DOMContentLoaded', () => {
    fetchAllData();
    setInterval(fetchAllData, autoRefreshInterval);
    document.getElementById('search-input').addEventListener('input', () => renderCards(printersData));
});
</script>
