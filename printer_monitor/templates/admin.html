{% extends "base.html" %}
{% block head %}
<style>
    .section-title { border-left: 4px solid #0d6efd; padding-left: 10px; }
</style>
{% endblock %}
{% block content %}

<!-- Upload de IPs via arquivo -->
<h3 class="section-title">Importar Impressoras (arquivo .txt)</h3>
<div class="row mb-3">
    <div class="col-md-6">
        <input type="file" id="txtFile" accept=".txt" class="form-control">
    </div>
    <div class="col-md-2">
        <button class="btn btn-info" onclick="uploadFile()">Enviar</button>
    </div>
</div>
<div id="upload-feedback"></div>
<hr>

<!-- Adicionar impressora manual -->
<h3 class="section-title">Adicionar Impressora Manualmente</h3>
<div class="row mb-3">
    <div class="col-md-3"><input type="text" id="new-ip" class="form-control" placeholder="IP"></div>
    <div class="col-md-3"><input type="text" id="new-location" class="form-control" placeholder="Local"></div>
    <div class="col-md-3"><input type="text" id="new-site" class="form-control" placeholder="Site"></div>
    <div class="col-md-3"><button class="btn btn-success w-100" onclick="addPrinter()">Adicionar</button></div>
</div>
<div id="feedback"></div>

<h5>Impressoras cadastradas:</h5>
<div id="printer-table"></div>
<hr>

<!-- Configuração de e-mail -->
<h3 class="section-title">Configuração de E-mail</h3>
<div class="row mb-3">
    <div class="col-md-3"><input type="text" id="smtp-server" class="form-control" placeholder="Servidor SMTP" value="{{ config.email.server }}"></div>
    <div class="col-md-2"><input type="number" id="smtp-port" class="form-control" placeholder="Porta" value="{{ config.email.port }}"></div>
    <div class="col-md-3"><input type="text" id="smtp-sender" class="form-control" placeholder="Remetente" value="{{ config.email.sender }}"></div>
    <div class="col-md-2"><input type="password" id="smtp-password" class="form-control" placeholder="Senha" value="{{ config.email.password }}"></div>
    <div class="col-md-2"><input type="text" id="smtp-recipient" class="form-control" placeholder="Destinatário" value="{{ config.email.recipient }}"></div>
</div>
<button class="btn btn-primary" onclick="saveEmail()">Salvar</button>
<div id="email-feedback" class="mt-2"></div>
<hr>

<!-- Configuração SNMP -->
<h3 class="section-title">Configuração SNMP</h3>
<div class="row mb-3">
    <div class="col-md-4">
        <label class="form-label">Comunidade SNMP</label>
        <input type="text" id="snmp-community" class="form-control" placeholder="public" value="{{ config.snmp_community or 'public' }}">
    </div>
    <div class="col-md-2 mt-4">
        <button class="btn btn-primary" onclick="saveSnmp()">Salvar</button>
    </div>
</div>
<div id="snmp-feedback"></div>
<hr>

<!-- Gerenciamento de usuários -->
<h3 class="section-title">Usuários de Acesso</h3>
<div class="row mb-3">
    <div class="col-md-4"><input type="text" id="new-username" class="form-control" placeholder="Novo usuário"></div>
    <div class="col-md-4"><input type="password" id="new-password" class="form-control" placeholder="Senha"></div>
    <div class="col-md-2"><button class="btn btn-success" onclick="addUser()">Criar</button></div>
</div>
<div id="user-feedback"></div>
<ul id="user-list" class="list-group"></ul>

<script>
// ---------- Impressoras ----------
function loadPrinters() {
    fetch('/api/printers')
        .then(res => res.json())
        .then(printers => {
            let html = '<table class="table table-bordered"><thead><tr><th>IP</th><th>Local</th><th>Site</th><th>Ação</th></tr></thead><tbody>';
            if (printers.length > 0) {
                printers.forEach(p => {
                    html += `<tr>
                        <td>${p.ip}</td>
                        <td>${p.location || ''}</td>
                        <td>${p.site || ''}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="removePrinter('${p.ip}')">Remover</button></td>
                    </tr>`;
                });
            } else {
                html += '<tr><td colspan="4">Nenhuma impressora cadastrada.</td></tr>';
            }
            html += '</tbody></table>';
            document.getElementById('printer-table').innerHTML = html;
        })
        .catch(err => console.error('Erro ao carregar impressoras:', err));
}

function addPrinter() {
    const ip = document.getElementById('new-ip').value.trim();
    const location = document.getElementById('new-location').value.trim();
    const site = document.getElementById('new-site').value.trim();
    if (!ip) {
        document.getElementById('feedback').innerHTML = '<div class="alert alert-warning">Informe o IP.</div>';
        return;
    }
    fetch('/api/printers/add', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ip, location, site})
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('feedback').innerHTML = data.success 
            ? '<div class="alert alert-success">Impressora adicionada!</div>'
            : '<div class="alert alert-warning">' + (data.error || 'Erro') + '</div>';
        if (data.success) {
            document.getElementById('new-ip').value = '';
            document.getElementById('new-location').value = '';
            document.getElementById('new-site').value = '';
            loadPrinters();
        }
    })
    .catch(err => alert('Erro na requisição: ' + err.message));
}

function removePrinter(ip) {
    if (!confirm('Remover ' + ip + '?')) return;
    fetch('/api/printers/remove/' + encodeURIComponent(ip), { method: 'DELETE' })
        .then(res => {
            if (!res.ok) throw new Error('Erro ' + res.status);
            return res.json();
        })
        .then(data => {
            if (data.success) {
                alert('Impressora removida.');
                loadPrinters();
            } else {
                alert('Erro: ' + (data.error || 'Falha ao remover'));
            }
        })
        .catch(err => alert('Erro na requisição: ' + err.message));
}

function uploadFile() {
    const fileInput = document.getElementById('txtFile');
    const file = fileInput.files[0];
    if (!file) {
        document.getElementById('upload-feedback').innerHTML = '<div class="alert alert-warning">Selecione um arquivo.</div>';
        return;
    }
    const formData = new FormData();
    formData.append('file', file);
    fetch('/api/printers/upload', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            document.getElementById('upload-feedback').innerHTML = data.success
                ? `<div class="alert alert-success">${data.added} impressora(s) importada(s).</div>`
                : '<div class="alert alert-warning">' + (data.error || 'Erro') + '</div>';
            if (data.success) {
                fileInput.value = '';
                loadPrinters();
            }
        })
        .catch(err => alert('Erro no upload: ' + err.message));
}

// ---------- E-mail ----------
function saveEmail() {
    const data = {
        server: document.getElementById('smtp-server').value.trim(),
        port: document.getElementById('smtp-port').value,
        sender: document.getElementById('smtp-sender').value.trim(),
        password: document.getElementById('smtp-password').value,
        recipient: document.getElementById('smtp-recipient').value.trim()
    };
    fetch('/api/email', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('email-feedback').innerHTML = data.success
            ? '<div class="alert alert-success">Configurações salvas!</div>'
            : '<div class="alert alert-danger">Erro ao salvar.</div>';
    })
    .catch(err => alert('Erro: ' + err.message));
}

// ---------- SNMP ----------
function saveSnmp() {
    const community = document.getElementById('snmp-community').value.trim() || 'public';
    fetch('/api/snmp', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({community: community})
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('snmp-feedback').innerHTML = data.success
            ? '<div class="alert alert-success">Comunidade salva.</div>'
            : '<div class="alert alert-danger">Erro ao salvar.</div>';
    })
    .catch(err => alert('Erro: ' + err.message));
}

// ---------- Usuários ----------
function loadUsers() {
    fetch('/api/users')
        .then(res => res.json())
        .then(users => {
            let html = '';
            users.forEach(u => {
                html += `<li class="list-group-item d-flex justify-content-between align-items-center">
                    ${u} 
                    <button class="btn btn-sm btn-outline-danger" onclick="removeUser('${u}')" ${u==='admin'?'disabled':''}>Remover</button>
                </li>`;
            });
            document.getElementById('user-list').innerHTML = html;
        });
}

function addUser() {
    const username = document.getElementById('new-username').value.trim();
    const password = document.getElementById('new-password').value.trim();
    if (!username || !password) {
        document.getElementById('user-feedback').innerHTML = '<div class="alert alert-warning">Preencha usuário e senha.</div>';
        return;
    }
    fetch('/api/users/add', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('user-feedback').innerHTML = data.success
            ? '<div class="alert alert-success">Usuário criado.</div>'
            : '<div class="alert alert-warning">' + (data.error || 'Erro') + '</div>';
        if (data.success) {
            document.getElementById('new-username').value = '';
            document.getElementById('new-password').value = '';
            loadUsers();
        }
    });
}

function removeUser(username) {
    if (!confirm('Remover usuário ' + username + '?')) return;
    fetch('/api/users/remove/' + username, {method: 'DELETE'})
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                loadUsers();
            } else {
                alert(data.error || 'Erro ao remover');
            }
        });
}

document.addEventListener('DOMContentLoaded', () => {
    loadPrinters();
    loadUsers();
});
</script>
{% endblock %}
