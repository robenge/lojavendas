{% extends "base.html" %}
{% block head %}
<style>
    .admin-panel {
        background: var(--panel-bg);
        border: 1px solid var(--border-tech);
        border-radius: 8px;
        padding: 25px;
        margin-bottom: 30px;
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    
    .section-title { 
        font-family: 'Share Tech Mono', monospace;
        color: var(--neon-cyan);
        border-left: 4px solid var(--neon-cyan); 
        padding-left: 15px; 
        margin-bottom: 25px;
        text-shadow: 0 0 10px rgba(0,243,255,0.3);
    }

    /* Tabelas Sci-Fi */
    .table-tech {
        color: var(--text-main);
        background: rgba(0,0,0,0.3);
        border-collapse: separate;
        border-spacing: 0;
    }
    .table-tech thead th {
        background: rgba(0, 243, 255, 0.1);
        color: var(--neon-cyan);
        font-family: 'Share Tech Mono', monospace;
        border-bottom: 2px solid var(--neon-cyan);
        border-top: 1px solid var(--border-tech);
    }
    .table-tech tbody td {
        border-bottom: 1px solid rgba(255,255,255,0.05);
        vertical-align: middle;
    }
    .table-tech tbody tr:hover {
        background: rgba(0, 243, 255, 0.05);
    }

    /* Listas de usuários */
    .list-group-tech .list-group-item {
        background: rgba(0,0,0,0.4);
        border: 1px solid var(--border-tech);
        color: var(--text-main);
        margin-bottom: 8px;
        border-radius: 4px !important;
        font-family: 'Share Tech Mono', monospace;
    }

    .form-label {
        font-family: 'Share Tech Mono', monospace;
        color: var(--text-muted);
        font-size: 0.9rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8">
        <!-- Gerenciamento de Impressoras -->
        <div class="admin-panel">
            <h3 class="section-title">TERMINAL DE IMPRESSORAS // ADICIONAR</h3>
            
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <label class="form-label">ENDEREÇO IP</label>
                    <input type="text" id="new-ip" class="form-control" placeholder="192.168.x.x">
                </div>
                <div class="col-md-3">
                    <label class="form-label">LOCALIZAÇÃO</label>
                    <input type="text" id="new-location" class="form-control" placeholder="Setor/Andar">
                </div>
                <div class="col-md-3">
                    <label class="form-label">SITE / FILIAL</label>
                    <input type="text" id="new-site" class="form-control" placeholder="Matriz">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-tech-success w-100" onclick="addPrinter()">INJETAR DADOS</button>
                </div>
            </div>
            <div id="feedback" class="mb-3"></div>

            <hr style="border-color: var(--border-tech); margin: 30px 0;">

            <h4 class="section-title" style="font-size: 1.2rem;">IMPORTAÇÃO EM LOTE (.TXT)</h4>
            <div class="row g-3 mb-3 align-items-end">
                <div class="col-md-8">
                    <input type="file" id="txtFile" accept=".txt" class="form-control">
                    <small class="text-muted mt-1 d-block">Formato: IP, Local, Site (um por linha)</small>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-tech w-100" onclick="uploadFile()">PROCESSAR ARQUIVO</button>
                </div>
            </div>
            <div id="upload-feedback"></div>
        </div>

        <div class="admin-panel">
            <h3 class="section-title">FROTA REGISTRADA</h3>
            <div class="table-responsive">
                <div id="printer-table"></div>
            </div>
        </div>
    </div>

    <div class="col-lg-4">
        <!-- SNMP -->
        <div class="admin-panel">
            <h3 class="section-title">PROTOCOLO SNMP</h3>
            <div class="mb-3">
                <label class="form-label">COMUNIDADE SNMP</label>
                <div class="input-group">
                    <input type="text" id="snmp-community" class="form-control" placeholder="public" value="{{ config.snmp_community or 'public' }}">
                    <button class="btn btn-tech" onclick="saveSnmp()">SALVAR</button>
                </div>
            </div>
            <div id="snmp-feedback"></div>
        </div>

        <!-- E-mail -->
        <div class="admin-panel">
            <h3 class="section-title">ROTEAMENTO DE ALERTAS</h3>
            <div class="mb-3">
                <label class="form-label">SERVIDOR SMTP</label>
                <input type="text" id="smtp-server" class="form-control mb-2" placeholder="smtp.exemplo.com" value="{{ config.email.server }}">
            </div>
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label">PORTA</label>
                    <input type="number" id="smtp-port" class="form-control" placeholder="587" value="{{ config.email.port }}">
                </div>
                <div class="col-6">
                    <label class="form-label">REMETENTE</label>
                    <input type="text" id="smtp-sender" class="form-control" placeholder="bot@sys.com" value="{{ config.email.sender }}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">SENHA DE APLICATIVO</label>
                <input type="password" id="smtp-password" class="form-control" placeholder="********" value="{{ config.email.password }}">
            </div>
            <div class="mb-3">
                <label class="form-label">DESTINATÁRIO ALVO</label>
                <input type="text" id="smtp-recipient" class="form-control" placeholder="admin@sys.com" value="{{ config.email.recipient }}">
            </div>
            <button class="btn btn-tech w-100" onclick="saveEmail()">ATUALIZAR ROTAS</button>
            <div id="email-feedback" class="mt-3"></div>
        </div>

        <!-- Usuários -->
        <div class="admin-panel">
            <h3 class="section-title">CONTROLE DE ACESSO</h3>
            <div class="row g-2 mb-3">
                <div class="col-12">
                    <input type="text" id="new-username" class="form-control" placeholder="Novo Operador">
                </div>
                <div class="col-8">
                    <input type="password" id="new-password" class="form-control" placeholder="Senha de Acesso">
                </div>
                <div class="col-4">
                    <button class="btn btn-tech-success w-100" onclick="addUser()">CRIAR</button>
                </div>
            </div>
            <div id="user-feedback" class="mb-3"></div>
            <ul id="user-list" class="list-group list-group-tech"></ul>
        </div>
    </div>
</div>

<script>
// ---------- Estilização de Alertas ----------
function showFeedback(elementId, message, type) {
    const el = document.getElementById(elementId);
    let color = type === 'success' ? 'var(--neon-green)' : (type === 'warning' ? 'var(--neon-orange)' : 'var(--neon-red)');
    el.innerHTML = `<div style="color: ${color}; font-family: 'Share Tech Mono'; padding: 10px; border: 1px solid ${color}; border-radius: 4px; background: rgba(0,0,0,0.5); box-shadow: inset 0 0 10px ${color}33;">> ${message}</div>`;
    setTimeout(() => { el.innerHTML = ''; }, 4000);
}

// ---------- Impressoras ----------
function loadPrinters() {
    fetch('/api/printers')
        .then(res => res.json())
        .then(printers => {
            let html = '<table class="table table-tech w-100"><thead><tr><th>IP</th><th>LOCAL</th><th>SITE</th><th class="text-end">AÇÃO</th></tr></thead><tbody>';
            if (printers.length > 0) {
                printers.forEach(p => {
                    html += `<tr>
                        <td style="font-family: 'Share Tech Mono'; color: var(--neon-cyan);">${p.ip}</td>
                        <td>${p.location || '-'}</td>
                        <td>${p.site || '-'}</td>
                        <td class="text-end"><button class="btn btn-sm btn-tech-danger" onclick="removePrinter('${p.ip}')">EXCLUIR</button></td>
                    </tr>`;
                });
            } else {
                html += '<tr><td colspan="4" class="text-center py-4 text-muted">Base de dados vazia.</td></tr>';
            }
            html += '</tbody></table>';
            document.getElementById('printer-table').innerHTML = html;
        });
}

function addPrinter() {
    const ip = document.getElementById('new-ip').value.trim();
    const location = document.getElementById('new-location').value.trim();
    const site = document.getElementById('new-site').value.trim();
    if (!ip) return showFeedback('feedback', 'ERRO: IP REQUERIDO', 'danger');
    
    fetch('/api/printers/add', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ip, location, site})
    }).then(res => res.json()).then(data => {
        if (data.success) {
            showFeedback('feedback', 'DISPOSITIVO INJETADO COM SUCESSO', 'success');
            document.getElementById('new-ip').value = '';
            document.getElementById('new-location').value = '';
            document.getElementById('new-site').value = '';
            loadPrinters();
        } else showFeedback('feedback', `ERRO: ${data.error}`, 'warning');
    });
}

function removePrinter(ip) {
    if (!confirm(`CONFIRMAR DELEÇÃO DO NÓ: ${ip}?`)) return;
    fetch('/api/printers/remove/' + encodeURIComponent(ip), { method: 'DELETE' })
        .then(res => res.json())
        .then(data => {
            if (data.success) loadPrinters();
            else alert('Erro: ' + data.error);
        });
}

function uploadFile() {
    const fileInput = document.getElementById('txtFile');
    const file = fileInput.files[0];
    if (!file) return showFeedback('upload-feedback', 'ERRO: ARQUIVO NÃO SELECIONADO', 'warning');
    
    const formData = new FormData();
    formData.append('file', file);
    fetch('/api/printers/upload', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                showFeedback('upload-feedback', `PROCESSADO: ${data.added} REGISTRO(S)`, 'success');
                fileInput.value = '';
                loadPrinters();
            } else showFeedback('upload-feedback', `ERRO: ${data.error}`, 'danger');
        });
}

// ---------- E-mail, SNMP e Usuários (Mesma Lógica, Feedback Visual Modificado) ----------
function saveEmail() {
    const data = {
        server: document.getElementById('smtp-server').value.trim(),
        port: document.getElementById('smtp-port').value,
        sender: document.getElementById('smtp-sender').value.trim(),
        password: document.getElementById('smtp-password').value,
        recipient: document.getElementById('smtp-recipient').value.trim()
    };
    fetch('/api/email', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) })
    .then(res => res.json()).then(data => {
        if (data.success) showFeedback('email-feedback', 'ROTAS ATUALIZADAS', 'success');
        else showFeedback('email-feedback', 'FALHA NA GRAVAÇÃO', 'danger');
    });
}

function saveSnmp() {
    const community = document.getElementById('snmp-community').value.trim() || 'public';
    fetch('/api/snmp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({community: community}) })
    .then(res => res.json()).then(data => {
        if (data.success) showFeedback('snmp-feedback', 'COMUNIDADE ATUALIZADA', 'success');
        else showFeedback('snmp-feedback', 'FALHA NA GRAVAÇÃO', 'danger');
    });
}

function loadUsers() {
    fetch('/api/users').then(res => res.json()).then(users => {
        let html = '';
        users.forEach(u => {
            html += `<li class="list-group-item d-flex justify-content-between align-items-center">
                <span><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-fill me-2" viewBox="0 0 16 16"><path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/></svg> ${u}</span>
                <button class="btn btn-sm btn-tech-danger" onclick="removeUser('${u}')" ${u==='admin'?'disabled':''}>DEL</button>
            </li>`;
        });
        document.getElementById('user-list').innerHTML = html;
    });
}

function addUser() {
    const username = document.getElementById('new-username').value.trim();
    const password = document.getElementById('new-password').value.trim();
    if (!username || !password) return showFeedback('user-feedback', 'DADOS INCOMPLETOS', 'warning');
    
    fetch('/api/users/add', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username, password}) })
    .then(res => res.json()).then(data => {
        if (data.success) {
            showFeedback('user-feedback', 'OPERADOR AUTORIZADO', 'success');
            document.getElementById('new-username').value = '';
            document.getElementById('new-password').value = '';
            loadUsers();
        } else showFeedback('user-feedback', `ERRO: ${data.error}`, 'danger');
    });
}

function removeUser(username) {
    if (!confirm(`REVOGAR ACESSO DO OPERADOR: ${username}?`)) return;
    fetch('/api/users/remove/' + username, {method: 'DELETE'}).then(res => res.json()).then(data => {
        if (data.success) loadUsers();
        else alert(data.error);
    });
}

document.addEventListener('DOMContentLoaded', () => { loadPrinters(); loadUsers(); });
</script>
{% endblock %}
