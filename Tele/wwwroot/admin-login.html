<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acesso administrativo · Monitor Network</title>
<link rel="stylesheet" href="style.css?v=12"><script src="admin-login.js?v=1" defer></script>
</head>
<body class="login-page">
<header class="topbar"><a class="brand" href="/" aria-label="Monitor de rede, início"><span class="brand-mark">M</span><span>MONITOR<span class="brand-sub">NETWORK OBSERVABILITY</span></span></a><nav class="top-actions"><a class="admin-link" href="/">← Voltar ao painel</a></nav></header>
<main class="login-shell">
  <section class="panel login-panel">
    <p class="eyebrow"><span class="eyebrow-line"></span> ÁREA RESTRITA</p>
    <h1>Acesso à Administração</h1>
    <p>Digite sua senha para gerenciar grupos e integrações.</p>
    <form id="loginForm" class="login-form">
      <label>Senha<input id="adminPassword" type="password" autocomplete="current-password" autofocus required></label>
      <button id="loginButton" class="admin-primary" type="submit">Entrar</button>
    </form>
    <p id="loginMessage" class="status-message" role="alert"></p>
    <p class="admin-note">A sessão expira após 8 horas de inatividade.</p>
  </section>
</main>
<footer><span class="footer-mark">M</span><span>MONITOR NETWORK</span><span class="footer-separator">·</span>© Robson Oliveira — Gerência de Serviços de TI</footer>
</body></html>
