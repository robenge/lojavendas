# NOVO script.html

<script>

let grafico


/*
==================================================
INICIAR
==================================================
*/
window.onload = () => {

  atualizarRelogio()

  carregarIndicadores()

  carregarFila()

  carregarServicos()

  setInterval(() => {

    atualizarRelogio()

  }, 1000)


  /*
  AUTO REFRESH
  */
  setInterval(() => {

    carregarIndicadores()

    carregarFila()

    carregarServicos()

  }, 30000)
}


/*
==================================================
RELOGIO
==================================================
*/
function atualizarRelogio() {

  const agora =
    new Date()

  document
    .getElementById("relogio")
    .innerText =

      agora.toLocaleString()
}


/*
==================================================
INDICADORES
==================================================
*/
function carregarIndicadores() {

  google.script.run

    .withSuccessHandler(

      (dados) => {

        document
          .getElementById("total")
          .innerText = dados.total

        document
          .getElementById("noshow")
          .innerText = dados.noshow

        document
          .getElementById("invalidos")
          .innerText = dados.invalidos

        carregarGrafico(
          dados.unidades
        )
      }
    )

    .obterIndicadores()
}


/*
==================================================
FILA
==================================================
*/
function carregarFila() {

  google.script.run

    .withSuccessHandler(

      (dados) => {

        const tabela =
          document
            .getElementById("filaTabela")

        tabela.innerHTML = ""

        document
          .getElementById("filaAtual")
          .innerText = dados.length

        dados.forEach(item => {

          tabela.innerHTML += `

            <tr>

              <td>${item.ticket}</td>

              <td>${item.ticket_customer_name || "-"}</td>

              <td>${item.queue_label}</td>

              <td>${formatarData(
                item.ticket_generated_at
              )}</td>

            </tr>
          `
        })
      }
    )

    .obterFilaTempoReal()
}


/*
==================================================
SERVIÇOS
==================================================
*/
function carregarServicos() {

  google.script.run

    .withSuccessHandler(

      (dados) => {

        const tabela =
          document
            .getElementById(
              "servicosTabela"
            )

        tabela.innerHTML = ""

        dados.forEach(item => {

          tabela.innerHTML += `

            <tr>

              <td>${item.ticket}</td>

              <td>${item.ticket_customer_name || "-"}</td>

              <td>${item.queue_label}</td>

              <td>

                ${item.service_desk_label}
                ${item.service_desk_number}

              </td>

              <td>${item.status}</td>

            </tr>
          `
        })
      }
    )

    .obterServicosAbertos()
}


/*
==================================================
GRÁFICO
==================================================
*/
function carregarGrafico(unidades) {

  const labels =
    Object.keys(unidades)

  const valores =
    Object.values(unidades)

  const ctx =
    document
      .getElementById(
        "graficoUnidades"
      )

  if (grafico) {

    grafico.destroy()
  }

  grafico = new Chart(ctx, {

    type: "bar",

    data: {

      labels,

      datasets: [

        {

          label:
            "Atendimentos",

          data: valores
        }
      ]
    }
  })
}


/*
==================================================
FORMATAR DATA
==================================================
*/
function formatarData(data) {

  if (!data) {

    return "-"
  }

  return new Date(data)
    .toLocaleString()
}

</script>
